{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block title %}Accedi{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Accedi</h2>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    {{ field(form.username) }}
    {{ field(form.password) }}
    <label class="check">{{ form.remember() }} {{ form.remember.label.text }}</label>
    {{ form.submit(class="btn full") }}
  </form>
  <p class="muted">Non hai un account? <a href="{{ url_for('auth.register') }}">Registrati</a></p>
</div>
{% endblock %}
